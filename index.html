<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Shadow Puppet - Classic Arcade Fighting Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Kanit:wght@800;900&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffffff;
            font-family: 'Kanit', sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
        }

        .pixel-font {
            font-family: 'VT323', monospace;
        }
    </style>
</head>

<body class="relative h-screen w-screen overflow-hidden bg-white text-slate-900 flex flex-col justify-between">

    <!-- Canvas Fullscreen Stage -->
    <canvas id="stageCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>

    <!-- Top Responsive Retro Arcade HUD Header -->
    <div
        class="relative z-10 w-full px-4 pt-3 pb-1 sm:px-8 sm:pt-4 md:px-12 flex items-center justify-between gap-3 pointer-events-none">

        <!-- PLAYER 1 HUD (LEFT) -->
        <div class="flex items-center gap-2 sm:gap-3 flex-1 max-w-[45%] justify-start">
            <div
                class="bg-black text-white font-black text-xs sm:text-sm md:text-base px-3 sm:px-5 py-1.5 rounded-full border-2 sm:border-3 border-black tracking-wider shrink-0 shadow-md">
                CHALAWAN
            </div>
            <div
                class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-full bg-black text-white text-xs sm:text-sm md:text-base font-black flex items-center justify-center shrink-0 border-2 sm:border-3 border-black shadow-md">
                P1
            </div>
            <div
                class="flex-1 h-7 sm:h-9 md:h-11 bg-black rounded-full p-1 sm:p-1.5 shadow-md border-2 sm:border-3 border-black flex items-center">
                <div class="w-full h-full bg-white rounded-full p-0.5 overflow-hidden">
                    <div id="p1HpBar" class="h-full bg-[#facc15] rounded-full transition-all duration-150"
                        style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- CENTER TIMER & ROUND COUNTER -->
        <div class="flex flex-col items-center justify-center shrink-0 mx-2">
            <div
                class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 bg-black rounded-full border-3 sm:border-4 border-black flex items-center justify-center text-white font-mono text-2xl sm:text-3xl md:text-4xl font-black shadow-lg pixel-font tracking-tighter">
                <span id="timerText">60</span>
            </div>
            <div class="flex gap-1.5 mt-1 sm:mt-1.5">
                <span
                    class="w-3 h-3 sm:w-4 sm:h-4 md:w-5 md:h-5 rounded-full border-2 sm:border-3 border-black bg-black inline-block shadow-sm"></span>
                <span
                    class="w-3 h-3 sm:w-4 sm:h-4 md:w-5 md:h-5 rounded-full border-2 sm:border-3 border-black bg-white inline-block shadow-sm"></span>
                <span
                    class="w-3 h-3 sm:w-4 sm:h-4 md:w-5 md:h-5 rounded-full border-2 sm:border-3 border-black bg-white inline-block shadow-sm"></span>
            </div>
        </div>

        <!-- PLAYER 2 HUD (RIGHT) -->
        <div class="flex items-center gap-2 sm:gap-3 flex-1 max-w-[45%] justify-end">
            <div
                class="flex-1 h-7 sm:h-9 md:h-11 bg-black rounded-full p-1 sm:p-1.5 shadow-md border-2 sm:border-3 border-black flex items-center">
                <div class="w-full h-full bg-white rounded-full p-0.5 overflow-hidden">
                    <div id="p2HpBar" class="h-full bg-[#facc15] rounded-full transition-all duration-150 ml-auto"
                        style="width: 100%;"></div>
                </div>
            </div>
            <div
                class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-full bg-black text-white text-xs sm:text-sm md:text-base font-black flex items-center justify-center shrink-0 border-2 sm:border-3 border-black shadow-md">
                P2
            </div>
            <div
                class="bg-black text-white font-black text-xs sm:text-sm md:text-base px-3 sm:px-5 py-1.5 rounded-full border-2 sm:border-3 border-black tracking-wider shrink-0 shadow-md">
                CHALAWAN
            </div>
        </div>

    </div>

    <!-- Solid Black Floor Bar at Bottom -->
    <div class="relative z-10 w-full h-10 sm:h-12 md:h-14 bg-black border-t-4 border-black shrink-0"></div>

    <!-- Game Over Winner Modal -->
    <div id="winnerModal"
        class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div
            class="bg-white border-4 border-black rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center space-y-5 shadow-2xl">
            <div id="winnerText" class="text-2xl sm:text-3xl font-black text-black tracking-wider">
                🎉 CHALAWAN P1 ชนะ!
            </div>
            <p class="text-xs text-slate-600 font-bold">การดวลหนังตะลุงสิ้นสุดลงแล้ว!</p>
            <button id="btnRestart"
                class="w-full py-3.5 bg-[#facc15] hover:bg-amber-400 text-black border-2 border-black font-black rounded-xl shadow-md hover:shadow-lg transition-all text-xs sm:text-sm tracking-wide">
                ⚔️ เล่นใหม่อีกครั้ง (RESTART)
            </button>
        </div>
    </div>

    <script>
        // =========================================================================
        // ⚙️ ตัวแปรสำหรับปรับองศาการฟัน ความเร็ว ระบบชาร์จ การหน่วงออร่า และการควบคุมมือ
        // =========================================================================
        const MAX_SLASH_ANGLE = 45;   // 📐 องศามุมการฟันไปข้างหน้าใน 1 ครั้ง
        const MAX_CHARGE_WINDUP = 28;   // 📐 องศาที่ดาบง้างถอยหลังเพิ่มขึ้นเมื่อชาร์จเต็ม
        const SLASH_SWING_SPEED = 4.2;  // ความเร็วตอนฟันดาบออก
        const SLASH_RETRACT_SPEED = 3.5;  // ความเร็วตอนชักดาบกลับ
        const MOVE_SPEED = 5.5;  // ความเร็วในการเดินของตัวละคร
        const BASE_DAMAGE = 20;   // ค่าความเสียหายพื้นฐาน (100%)
        const PART_FLASH_DURATION = 22;   // ระยะเวลา (เฟรม) ที่ชิ้นส่วนร่างกายเปลี่ยนสีเมื่อโดนฟัน
        const CLASH_KNOCKBACK = 28;   // ระยะกระเด็นถอยหลังเมื่อดาบฟันปะทะกันเอง

        // --- ตัวแปรระบบ Charge Attack, ดีเลย์ออร่าสีแดง & การควบคุมมือ ---
        const MAX_CHARGE_MULTIPLIER = 1.5;  // ความแรงสูงสุดเมื่อชาร์จเต็ม (1.5 เท่า)
        const MAX_CHARGE_FRAMES = 55;   // จำนวนเฟรมที่ใช้ชาร์จจนเต็ม 100% (~0.9 วินาที)
        const CHARGE_AURA_DELAY_FRAMES = 14;   // ⏳ ดีเลย์ (จำนวนเฟรม) ก่อนที่ออร่าสีแดงจะเริ่มปรากฏเมื่อกดชาร์จค้าง
        const HAND_CONTROL_SPEED = 2.2;  // ความเร็วในการบังคับยก/ลดมือที่ถือดาบ (Q/E และ U/O)
        const HAND_MIN_ANGLE = -55;  // มุมยกมือสูงสุด (เล็งส่วนหัว)
        const HAND_MAX_ANGLE = 50;   // มุมลดมือต่ำสุด (เล็งส่วนขา)

        // --- 1. CONFIG & RIGGING DATA ---
        const DEFAULT_JOINTS = {
            upper_body: { x: 0, y: 0, pivotX: 0, pivotY: 0, rotation: 0, zIndex: 70 },
            head: { x: 0, y: -101, pivotX: 38, pivotY: -93, rotation: 0, zIndex: 80 },
            lower_body: { x: 0, y: 154, pivotX: 0, pivotY: 0, rotation: 0, zIndex: 82 },
            right_upper_arm: { x: 95, y: -4, pivotX: 35, pivotY: 24, rotation: 0, zIndex: 30 },
            right_arm: { x: 78, y: 71, pivotX: 55, pivotY: -18, rotation: -9, zIndex: 40 },
            sword: { x: 34, y: 4, pivotX: -8, pivotY: -178, rotation: 16, zIndex: 50 },
            right_hand: { x: 108, y: -44, pivotX: 24, pivotY: 3, rotation: 0, zIndex: 60 },
            left_upper_arm: { x: -87, y: -5, pivotX: -45, pivotY: 4, rotation: 0, zIndex: 20 },
            left_arm: { x: -104, y: 24, pivotX: -39, pivotY: 38, rotation: 0, zIndex: 21 },
            left_hand: { x: -78, y: 88, pivotX: 1, pivotY: 24, rotation: 0, zIndex: 22 },
            right_leg: { x: 50, y: -1, pivotX: 27, pivotY: 25, rotation: 0, zIndex: 13 },
            right_foot: { x: 65, y: 70, pivotX: 49, pivotY: 62, rotation: 0, zIndex: 14 },
            left_leg: { x: -70, y: 3, pivotX: -7, pivotY: 28, rotation: 0, zIndex: 11 },
            left_foot: { x: -36, y: 80, pivotX: -19, pivotY: 75, rotation: 0, zIndex: 12 }
        };

        // โครงสร้าง Capsule Hitbox ของแต่ละชิ้นส่วน
        const PART_HITBOX_CONFIG = {
            head: { radius: 44, x1: 0, y1: 10, x2: 45, y2: -125 },
            upper_body: { radius: 56, x1: 0, y1: -95, x2: 0, y2: 115 },
            lower_body: { radius: 50, x1: 0, y1: -45, x2: 0, y2: 65 },
            right_upper_arm: { radius: 30, x1: 0, y1: 0, x2: 78, y2: 71 },
            right_arm: { radius: 26, x1: 0, y1: 0, x2: 108, y2: -44 },
            right_hand: { radius: 24, x1: 0, y1: 0, x2: 40, y2: 6 },
            left_upper_arm: { radius: 30, x1: 0, y1: 0, x2: -104, y2: 24 },
            left_arm: { radius: 26, x1: 0, y1: 0, x2: -78, y2: 88 },
            left_hand: { radius: 24, x1: 0, y1: 0, x2: 2, y2: 48 },
            right_leg: { radius: 35, x1: 0, y1: 0, x2: 65, y2: 70 },
            right_foot: { radius: 30, x1: 0, y1: 0, x2: 85, y2: 110 },
            left_leg: { radius: 35, x1: 0, y1: 0, x2: -36, y2: 80 },
            left_foot: { radius: 30, x1: 0, y1: 0, x2: -35, y2: 130 }
        };

        const SCENE_GRAPH = {
            upper_body: { parent: null },
            head: { parent: 'upper_body' },
            lower_body: { parent: 'upper_body' },
            left_leg: { parent: 'lower_body' },
            left_foot: { parent: 'left_leg' },
            right_leg: { parent: 'lower_body' },
            right_foot: { parent: 'right_leg' },
            left_upper_arm: { parent: 'upper_body' },
            left_arm: { parent: 'left_upper_arm' },
            left_hand: { parent: 'left_arm' },
            right_upper_arm: { parent: 'upper_body' },
            right_arm: { parent: 'right_upper_arm' },
            right_hand: { parent: 'right_arm' },
            sword: { parent: 'right_hand' }
        };

        let p1Joints = JSON.parse(JSON.stringify(DEFAULT_JOINTS));
        let p2Joints = JSON.parse(JSON.stringify(DEFAULT_JOINTS));

        function createPlayerState(xRatio, facing) {
            return {
                x: window.innerWidth * xRatio,
                y: window.innerHeight * 0.58,
                vx: 0,
                vy: 0,
                scale: 0.78,
                facingDir: facing,
                visualFacingX: facing,
                handAimAngle: 0,
                isCharging: false,
                chargeFrames: 0,
                chargeRatio: 0,
                activeSlashCharge: 0,
                activeSlashAura: 0,
                activeSlashMultiplier: 1,
                isSlashing: false,
                slashState: 'idle',
                slashAngle: 0,
                hp: 100,
                maxHp: 100,
                hitCooldown: 0,
                clashCooldown: 0,
                partHitTimers: {},
                walkPhase: Math.random() * Math.PI * 2,
                idlePhase: Math.random() * Math.PI * 2,
                walkBlend: 0,
                worldTransforms: {},
                swordSegmentsWorld: [],
                bodyCapsulesWorld: {}
            };
        }

        let p1 = createPlayerState(0.28, 1);
        let p2 = createPlayerState(0.72, -1);

        let keys = {};
        let gameOver = false;
        let particles = [];
        let timerSeconds = 60;
        let timerInterval = null;

        const componentNames = Object.keys(DEFAULT_JOINTS);
        const images = {};

        componentNames.forEach(name => {
            const img = new Image();
            img.src = `Body_Component/${name}.png`;
            images[name] = img;
        });

        // --- 2. CANVAS SETUP & DYNAMIC SCALING ---
        const canvas = document.getElementById('stageCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const responsiveScale = Math.min(Math.max(canvas.height * 0.00105, 0.65), 0.88);
            p1.scale = responsiveScale;
            p2.scale = responsiveScale;

            if (!gameOver) {
                p1.y = canvas.height * 0.56;
                p2.y = canvas.height * 0.56;
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Round Timer
        timerInterval = setInterval(() => {
            if (!gameOver && timerSeconds > 0) {
                timerSeconds--;
                document.getElementById('timerText').textContent = timerSeconds;
                if (timerSeconds === 0) {
                    if (p1.hp > p2.hp) triggerGameOver('🎉 CHALAWAN P1 ชนะ (หมดเวลา)!');
                    else if (p2.hp > p1.hp) triggerGameOver('🎉 CHALAWAN P2 ชนะ (หมดเวลา)!');
                    else triggerGameOver('🤝 เสมอกัน!');
                }
            }
        }, 1000);

        function getSwordAuraIntensity(playerObj) {
            if (playerObj.isCharging) {
                if (playerObj.chargeFrames <= CHARGE_AURA_DELAY_FRAMES) {
                    return 0;
                }
                const effectiveFrames = playerObj.chargeFrames - CHARGE_AURA_DELAY_FRAMES;
                const maxEffectiveFrames = Math.max(1, MAX_CHARGE_FRAMES - CHARGE_AURA_DELAY_FRAMES);
                return Math.min(1, effectiveFrames / maxEffectiveFrames);
            }
            if (playerObj.isSlashing && playerObj.slashState === 'swing') {
                return playerObj.activeSlashAura || 0;
            }
            return 0;
        }

        // --- 3. KEYBOARD INPUTS ---
        function startCharging(playerObj) {
            if (!playerObj.isSlashing && !playerObj.isCharging) {
                playerObj.isCharging = true;
                playerObj.chargeFrames = 0;
                playerObj.chargeRatio = 0;
            }
        }

        function releaseChargeAndSlash(playerObj) {
            if (playerObj.isCharging) {
                const auraAtRelease = getSwordAuraIntensity(playerObj);
                playerObj.isCharging = false;
                playerObj.isSlashing = true;
                playerObj.slashState = 'swing';
                playerObj.activeSlashCharge = playerObj.chargeRatio;
                playerObj.activeSlashAura = auraAtRelease;
                playerObj.activeSlashMultiplier = 1 + (MAX_CHARGE_MULTIPLIER - 1) * playerObj.chargeRatio;
                playerObj.chargeFrames = 0;
                playerObj.chargeRatio = 0;
            }
        }

        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            keys[e.key] = true;
            keys[e.code] = true;

            if (!gameOver && !e.repeat) {
                if (e.code === 'Space') {
                    startCharging(p1);
                }
                if (e.code === 'Enter') {
                    startCharging(p2);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            keys[e.key] = false;
            keys[e.code] = false;

            if (!gameOver) {
                if (e.code === 'Space') {
                    releaseChargeAndSlash(p1);
                }
                if (e.code === 'Enter') {
                    releaseChargeAndSlash(p2);
                }
            }
        });

        // --- 4. KINEMATICS & MATRIX CALCULATIONS ---
        function multiplyMatrix(m1, m2) {
            return [
                m1[0] * m2[0] + m1[2] * m2[1],
                m1[1] * m2[0] + m1[3] * m2[1],
                m1[0] * m2[2] + m1[2] * m2[3],
                m1[1] * m2[2] + m1[3] * m2[3],
                m1[0] * m2[4] + m1[2] * m2[5] + m1[4],
                m1[1] * m2[4] + m1[3] * m2[5] + m1[5]
            ];
        }

        function createTransformMatrix(x, y, rotationDegrees) {
            const rad = (rotationDegrees * Math.PI) / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);
            return [cos, sin, -sin, cos, x, y];
        }

        function getJointAnimationOffset(playerObj, name) {
            let dx = 0, dy = 0, dRot = 0;

            const wp = playerObj.walkPhase;
            const ip = playerObj.idlePhase;
            const wb = playerObj.walkBlend;

            const slashForwardRatio = (playerObj.isSlashing && playerObj.slashAngle > 0)
                ? (playerObj.slashAngle / MAX_SLASH_ANGLE)
                : 0;

            const chargeRatio = playerObj.isCharging
                ? playerObj.chargeRatio
                : (playerObj.isSlashing && playerObj.slashAngle < 0 ? Math.abs(playerObj.slashAngle) / MAX_CHARGE_WINDUP : 0);

            const auraIntensity = getSwordAuraIntensity(playerObj);
            const chargeTremor = playerObj.isCharging
                ? Math.sin(performance.now() * 0.06) * 1.8 * auraIntensity
                : 0;

            const handAimNorm = playerObj.handAimAngle / 50;
            const forwardMove = (playerObj.vx * playerObj.facingDir) / MOVE_SPEED;

            switch (name) {
                case 'upper_body':
                    dy = Math.abs(Math.sin(wp)) * -2.5 * wb + Math.sin(ip) * 1.5 * (1 - wb);
                    dRot = (forwardMove * 2 + Math.sin(wp) * 1) * wb
                        + (slashForwardRatio * 5)
                        - (chargeRatio * 6)
                        + (handAimNorm * 4);
                    break;

                case 'head':
                    dy = Math.sin(wp * 2) * -1 * wb;
                    dRot = (Math.sin(wp - 0.4) * 2 * wb)
                        + (Math.sin(ip - 0.5) * 1.5 * (1 - wb))
                        - (slashForwardRatio * 4)
                        + (chargeRatio * 5)
                        + (handAimNorm * 6);
                    break;

                case 'lower_body':
                    dy = Math.sin(wp * 2) * 1 * wb;
                    dRot = -forwardMove * 1.5 * wb + Math.cos(wp) * 1 * wb + (chargeRatio * 4);
                    break;

                case 'right_upper_arm':
                    dx = (Math.cos(wp) * 2 * wb) + (slashForwardRatio * 10) - (chargeRatio * 10);
                    dy = (Math.sin(wp * 2) * -2 * wb) + (Math.sin(ip) * -1 * (1 - wb)) - (slashForwardRatio * 4) + (handAimNorm * 12) - (chargeRatio * 6);
                    dRot = (Math.sin(wp) * 4 * wb)
                        + (Math.sin(ip) * 1.5 * (1 - wb))
                        + (playerObj.handAimAngle * 0.6)
                        + playerObj.slashAngle
                        + chargeTremor;
                    break;

                case 'right_arm':
                    dx = (Math.sin(wp) * 2.5 * wb) + (slashForwardRatio * 10) - (chargeRatio * 10);
                    dy = (Math.cos(wp) * 2 * wb) - (slashForwardRatio * 6) + (handAimNorm * 16) - (chargeRatio * 8);
                    dRot = (Math.sin(wp - 0.6) * 5 * wb)
                        + (Math.cos(ip) * 1.5 * (1 - wb))
                        + (playerObj.handAimAngle * 0.4)
                        + (slashForwardRatio * 8)
                        - (chargeRatio * 10);
                    break;

                case 'right_hand':
                    dx = (Math.cos(wp) * 3 * wb)
                        + (forwardMove * 2 * wb)
                        + (slashForwardRatio * 14)
                        - (chargeRatio * 12)
                        + ((1 - Math.abs(handAimNorm)) * 5);
                    dy = (Math.sin(wp) * 2.5 * wb)
                        + (Math.sin(ip) * 1.5 * (1 - wb))
                        + (slashForwardRatio * 5)
                        + (handAimNorm * 22)
                        - (chargeRatio * 8);
                    dRot = (Math.sin(wp - 0.9) * 4 * wb)
                        + (playerObj.handAimAngle * 0.35)
                        + (slashForwardRatio * 6)
                        - (chargeRatio * 8)
                        + chargeTremor;
                    break;

                case 'sword':
                    dRot = -(chargeRatio * 8) + (slashForwardRatio * 4) + chargeTremor * 1.2;
                    break;

                case 'left_upper_arm':
                    dx = -Math.cos(wp) * 2 * wb;
                    dy = Math.sin(wp * 2 + Math.PI) * -1.5 * wb;
                    dRot = (-Math.sin(wp) * 8 * wb) + (Math.sin(ip + Math.PI) * 1.5 * (1 - wb)) - (slashForwardRatio * 12) + (chargeRatio * 10);
                    break;

                case 'left_arm':
                    dx = -Math.sin(wp) * 1.5 * wb;
                    dy = Math.cos(wp) * 1.5 * wb;
                    dRot = (-Math.sin(wp - 0.5) * 7 * wb) - 3 * wb + (chargeRatio * 8);
                    break;

                case 'left_hand':
                    dx = -Math.cos(wp) * 2 * wb;
                    dy = -Math.sin(wp) * 2 * wb;
                    dRot = -Math.sin(wp - 0.8) * 4 * wb;
                    break;

                case 'right_leg':
                    dx = Math.sin(wp) * 3.5 * wb;
                    dy = Math.min(0, Math.cos(wp) * 3) * wb;
                    dRot = Math.sin(wp) * 10 * wb;
                    break;

                case 'right_foot':
                    dy = Math.max(0, Math.cos(wp) * -3) * wb;
                    dRot = (Math.max(0, Math.cos(wp)) * 8 - 3) * wb;
                    break;

                case 'left_leg':
                    dx = Math.sin(wp + Math.PI) * 3.5 * wb;
                    dy = Math.min(0, Math.cos(wp + Math.PI) * 3) * wb;
                    dRot = Math.sin(wp + Math.PI) * 10 * wb;
                    break;

                case 'left_foot':
                    dy = Math.max(0, Math.cos(wp + Math.PI) * -3) * wb;
                    dRot = (Math.max(0, Math.cos(wp + Math.PI)) * 8 - 3) * wb;
                    break;
            }

            return { dx, dy, dRot };
        }

        function getLocalMatrix(playerObj, jointsObj, name) {
            const j = jointsObj[name] || { x: 0, y: 0, rotation: 0 };
            const anim = getJointAnimationOffset(playerObj, name);
            return createTransformMatrix(j.x + anim.dx, j.y + anim.dy, j.rotation + anim.dRot);
        }

        function localToWorld(playerObj, m, lx, ly) {
            const relX = m[4] + m[0] * lx + m[2] * ly;
            const relY = m[5] + m[1] * lx + m[3] * ly;
            return {
                x: playerObj.x + relX * playerObj.scale * playerObj.visualFacingX,
                y: playerObj.y + relY * playerObj.scale
            };
        }

        function segmentToSegmentCollision(A, B, C, D) {
            const ux = B.x - A.x, uy = B.y - A.y;
            const vx = D.x - C.x, vy = D.y - C.y;
            const wx = A.x - C.x, wy = A.y - C.y;

            const a = ux * ux + uy * uy;
            const b = ux * vx + uy * vy;
            const c = vx * vx + vy * vy;
            const d = ux * wx + uy * wy;
            const e = vx * wx + vy * wy;
            const D_det = a * c - b * b;

            let sc, sN, sD = D_det;
            let tc, tN, tD = D_det;

            if (D_det < 1e-7) {
                sN = 0.0;
                sD = 1.0;
                tN = e;
                tD = c;
            } else {
                sN = (b * e - c * d);
                tN = (a * e - b * d);
                if (sN < 0.0) {
                    sN = 0.0;
                    tN = e;
                    tD = c;
                } else if (sN > sD) {
                    sN = sD;
                    tN = e + b;
                    tD = c;
                }
            }

            if (tN < 0.0) {
                tN = 0.0;
                if (-d < 0.0) sN = 0.0;
                else if (-d > a) sN = sD;
                else {
                    sN = -d;
                    sD = a;
                }
            } else if (tN > tD) {
                tN = tD;
                if ((-d + b) < 0.0) sN = 0.0;
                else if ((-d + b) > a) sN = sD;
                else {
                    sN = (-d + b);
                    sD = a;
                }
            }

            sc = (Math.abs(sN) < 1e-7 ? 0.0 : sN / sD);
            tc = (Math.abs(tN) < 1e-7 ? 0.0 : tN / tD);

            const closestOnAB = { x: A.x + sc * ux, y: A.y + sc * uy };
            const closestOnCD = { x: C.x + tc * vx, y: C.y + tc * vy };

            const dx = closestOnAB.x - closestOnCD.x;
            const dy = closestOnAB.y - closestOnCD.y;

            return {
                distance: Math.sqrt(dx * dx + dy * dy),
                contactPoint: {
                    x: (closestOnAB.x + closestOnCD.x) * 0.5,
                    y: (closestOnAB.y + closestOnCD.y) * 0.5
                }
            };
        }

        function updatePlayerTransforms(playerObj, jointsObj) {
            const worldTransforms = {};

            function computeWorldTransform(name, parentMatrix) {
                const localM = getLocalMatrix(playerObj, jointsObj, name);
                const worldM = parentMatrix ? multiplyMatrix(parentMatrix, localM) : localM;
                worldTransforms[name] = worldM;

                for (const [childName, config] of Object.entries(SCENE_GRAPH)) {
                    if (config.parent === name) {
                        computeWorldTransform(childName, worldM);
                    }
                }
            }

            computeWorldTransform('upper_body', null);
            playerObj.worldTransforms = worldTransforms;

            Object.keys(PART_HITBOX_CONFIG).forEach(partName => {
                const m = worldTransforms[partName];
                if (!m) return;

                const cfg = PART_HITBOX_CONFIG[partName];
                const j = jointsObj[partName] || { pivotX: 0, pivotY: 0 };
                const img = images[partName];

                const segments = [];

                segments.push({
                    a: localToWorld(playerObj, m, cfg.x1, cfg.y1),
                    b: localToWorld(playerObj, m, cfg.x2, cfg.y2),
                    radius: cfg.radius * playerObj.scale
                });

                if (img && img.complete && img.naturalWidth > 0) {
                    const halfW = img.width * 0.42;
                    const halfH = img.height * 0.42;
                    if (img.height >= img.width) {
                        const span = Math.max(10, halfH - halfW * 0.5);
                        segments.push({
                            a: localToWorld(playerObj, m, j.pivotX, j.pivotY - span),
                            b: localToWorld(playerObj, m, j.pivotX, j.pivotY + span),
                            radius: halfW * playerObj.scale
                        });
                    } else {
                        const span = Math.max(10, halfW - halfH * 0.5);
                        segments.push({
                            a: localToWorld(playerObj, m, j.pivotX - span, j.pivotY),
                            b: localToWorld(playerObj, m, j.pivotX + span, j.pivotY),
                            radius: halfH * playerObj.scale
                        });
                    }
                }

                playerObj.bodyCapsulesWorld[partName] = segments;
            });

            if (worldTransforms['sword']) {
                const swM = worldTransforms['sword'];
                const j = jointsObj['sword'] || { pivotX: -8, pivotY: -178 };
                const swordImg = images['sword'];
                const hasSwordImg = swordImg && swordImg.complete && swordImg.naturalWidth > 0;

                const halfBladeLen = hasSwordImg
                    ? (swordImg.height / 2)
                    : Math.max(Math.abs(j.pivotY), 75);

                const bladeRadius = (hasSwordImg ? Math.min(swordImg.width * 0.35, 22) : 16) * playerObj.scale;

                const hiltWorld = localToWorld(playerObj, swM, 0, 20);
                const midWorld = localToWorld(playerObj, swM, j.pivotX, j.pivotY);
                const tipWorld = localToWorld(playerObj, swM, j.pivotX, j.pivotY - halfBladeLen);

                playerObj.swordSegmentsWorld = [
                    { a: hiltWorld, b: midWorld, radius: bladeRadius },
                    { a: midWorld, b: tipWorld, radius: bladeRadius }
                ];
            }
        }

        // --- 5. RENDER PLAYER & RED SWORD CHARGE AURA ---
        function drawSwordRedAura(img, auraIntensity) {
            const pulse = 0.85 + Math.sin(performance.now() * 0.025) * 0.15;
            const glowRadiusOuter = (14 + auraIntensity * 26) * pulse;
            const glowRadiusInner = (6 + auraIntensity * 12) * pulse;

            ctx.save();

            const bladeHalfH = (img && img.complete && img.naturalWidth !== 0) ? (img.height * 0.48) : 175;
            const bladeHalfW = (img && img.complete && img.naturalWidth !== 0) ? (img.width * 0.38) : 18;

            const grad = ctx.createRadialGradient(0, 0, 4, 0, 0, bladeHalfH);
            grad.addColorStop(0, `rgba(239, 68, 68, ${(0.45 + auraIntensity * 0.4) * pulse})`);
            grad.addColorStop(0.6, `rgba(220, 38, 38, ${(0.25 + auraIntensity * 0.35) * pulse})`);
            grad.addColorStop(1, 'rgba(220, 38, 38, 0)');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(0, -10, bladeHalfW + auraIntensity * 22 * pulse, bladeHalfH + 18, 0, 0, Math.PI * 2);
            ctx.fill();

            if (img && img.complete && img.naturalWidth !== 0) {
                ctx.filter = `drop-shadow(0px 0px ${glowRadiusInner}px rgba(255, 80, 80, 0.95)) drop-shadow(0px 0px ${glowRadiusOuter}px rgba(220, 38, 38, 0.9))`;
                ctx.globalAlpha = Math.min(1, 0.4 + auraIntensity * 0.6);
                ctx.drawImage(img, -img.width / 2, -img.height / 2);
            } else {
                ctx.shadowColor = '#dc2626';
                ctx.shadowBlur = glowRadiusOuter;
                ctx.fillStyle = `rgba(239, 68, 68, ${0.4 + auraIntensity * 0.55})`;
                ctx.beginPath();
                ctx.roundRect(-10 - auraIntensity * 5, -176, 20 + auraIntensity * 10, 348, 12);
                ctx.fill();
            }

            ctx.restore();
        }

        function renderPlayer(playerObj, jointsObj) {
            const worldTransforms = playerObj.worldTransforms;
            if (!worldTransforms || !worldTransforms['upper_body']) return;

            ctx.save();
            ctx.translate(playerObj.x, playerObj.y);
            ctx.scale(playerObj.scale * playerObj.visualFacingX, playerObj.scale);

            drawPuppetSticks(playerObj, worldTransforms);

            const sortedNames = Object.keys(jointsObj).sort((a, b) => {
                return (jointsObj[a].zIndex || 0) - (jointsObj[b].zIndex || 0);
            });

            const swordAuraIntensity = getSwordAuraIntensity(playerObj);

            sortedNames.forEach(name => {
                const worldM = worldTransforms[name];
                if (!worldM) return;

                const j = jointsObj[name] || { pivotX: 0, pivotY: 0 };
                const isPartHit = (playerObj.partHitTimers[name] || 0) > 0;

                ctx.save();
                ctx.transform(worldM[0], worldM[1], worldM[2], worldM[3], worldM[4], worldM[5]);

                ctx.save();
                ctx.translate(j.pivotX, j.pivotY);

                const img = images[name];

                if (name === 'sword' && swordAuraIntensity > 0.01) {
                    drawSwordRedAura(img, swordAuraIntensity);
                }

                if (isPartHit) {
                    if (name === 'sword') {
                        ctx.filter = 'invert(75%) sepia(95%) saturate(2500%) hue-rotate(5deg) brightness(115%) drop-shadow(0px 0px 10px rgba(250, 204, 21, 0.95))';
                    } else {
                        ctx.filter = 'invert(28%) sepia(98%) saturate(6500%) hue-rotate(352deg) brightness(105%) contrast(115%) drop-shadow(0px 0px 8px rgba(239, 68, 68, 0.85))';
                    }
                }

                if (img && img.complete && img.naturalWidth !== 0) {
                    ctx.drawImage(img, -img.width / 2, -img.height / 2);
                } else {
                    drawProceduralFallback(name, isPartHit);
                }
                ctx.restore();
                ctx.restore();
            });

            ctx.restore();
        }

        function drawPuppetSticks(playerObj, worldTransforms) {
            ctx.save();
            ctx.strokeStyle = '#a1a1aa';
            ctx.lineWidth = 4;

            if (worldTransforms['lower_body']) {
                const lb = worldTransforms['lower_body'];
                ctx.beginPath();
                ctx.moveTo(lb[4], lb[5]);
                ctx.lineTo(lb[4], 2000);
                ctx.stroke();
            }

            if (worldTransforms['right_hand']) {
                const rh = worldTransforms['right_hand'];
                ctx.beginPath();
                ctx.moveTo(rh[4], rh[5]);
                ctx.lineTo(rh[4] + 60, 2000);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawProceduralFallback(name, isPartHit = false) {
            const hitColor = (name === 'sword') ? '#facc15' : '#ef4444';
            ctx.fillStyle = isPartHit ? hitColor : '#000000';
            ctx.strokeStyle = isPartHit ? hitColor : '#000000';
            ctx.lineWidth = 3;

            switch (name) {
                case 'upper_body':
                    ctx.beginPath();
                    ctx.moveTo(-25, -60);
                    ctx.lineTo(25, -60);
                    ctx.lineTo(35, 20);
                    ctx.lineTo(-35, 20);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'head':
                    ctx.beginPath();
                    ctx.arc(0, -20, 22, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(10, -25);
                    ctx.lineTo(45, -20);
                    ctx.lineTo(40, -10);
                    ctx.lineTo(10, -15);
                    ctx.fill();
                    break;
                case 'lower_body':
                    ctx.beginPath();
                    ctx.moveTo(-35, 0);
                    ctx.lineTo(35, 0);
                    ctx.lineTo(20, 40);
                    ctx.lineTo(-20, 40);
                    ctx.closePath();
                    ctx.fill();
                    break;
                case 'right_upper_arm':
                case 'left_upper_arm':
                    ctx.beginPath();
                    ctx.ellipse(25, 0, 25, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'right_arm':
                case 'left_arm':
                    ctx.beginPath();
                    ctx.ellipse(20, 0, 20, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'right_hand':
                case 'left_hand':
                    ctx.beginPath();
                    ctx.arc(8, 0, 8, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'sword':
                    ctx.beginPath();
                    ctx.fillRect(-5, -170, 10, 340);
                    ctx.fillRect(-18, 140, 36, 8);
                    break;
                case 'right_leg':
                case 'left_leg':
                    ctx.beginPath();
                    ctx.ellipse(0, 20, 10, 22, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'right_foot':
                case 'left_foot':
                    ctx.beginPath();
                    ctx.ellipse(10, 15, 16, 8, 0, 0, Math.PI * 2);
                    ctx.fill();
                    break;
            }
        }

        // --- 6. HIT SPARKS & PARTICLES ---
        function createHitSparks(x, y, isCritical, chargeMult = 1) {
            const baseCount = isCritical ? 24 : 14;
            const count = Math.round(baseCount * chargeMult);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * (isCritical ? 16 : 11) * chargeMult,
                    vy: (Math.random() - 0.5) * (isCritical ? 16 : 11) * chargeMult,
                    size: (Math.random() * 5 + (isCritical ? 3 : 2)) * Math.min(1.3, chargeMult),
                    color: isCritical ? ['#ef4444', '#dc2626', '#000000', '#f59e0b'] : ['#000000', '#ef4444', '#f59e0b'],
                    life: 22
                });
            }
        }

        function createClashSparks(x, y) {
            for (let i = 0; i < 32; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 11 + 3;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 5.5 + 2.5,
                    color: ['#facc15', '#f59e0b', '#ffffff', '#000000'],
                    life: 24
                });
            }
        }

        function spawnSwordAuraParticles(playerObj) {
            const intensity = getSwordAuraIntensity(playerObj);
            if (intensity <= 0.01 || playerObj.swordSegmentsWorld.length === 0) return;

            const spawnCount = playerObj.isCharging ? (intensity > 0.65 ? 3 : 1) : 2;
            for (let i = 0; i < spawnCount; i++) {
                const seg = playerObj.swordSegmentsWorld[Math.floor(Math.random() * playerObj.swordSegmentsWorld.length)];
                const t = Math.random();
                const px = seg.a.x + (seg.b.x - seg.a.x) * t + (Math.random() - 0.5) * 14;
                const py = seg.a.y + (seg.b.y - seg.a.y) * t + (Math.random() - 0.5) * 14;

                particles.push({
                    x: px,
                    y: py,
                    vx: (Math.random() - 0.5) * 2.5,
                    vy: -Math.random() * 3.2 - 0.8,
                    size: Math.random() * (3.2 + intensity * 3.5) + 1.5,
                    color: ['#ef4444', '#dc2626', '#f87171', '#b91c1c'],
                    life: 14
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = p.color[Math.floor(Math.random() * p.color.length)];
                ctx.fill();
            });
        }

        // --- 7. SWORD CLASH & HITBOX DETECTION ---
        function checkSwordClash(p1Obj, p2Obj) {
            const bothSlashing = p1Obj.isSlashing && p2Obj.isSlashing;
            const activeSwing = (p1Obj.slashState === 'swing' || p2Obj.slashState === 'swing');

            if (bothSlashing && activeSwing && p1Obj.clashCooldown <= 0 && p2Obj.clashCooldown <= 0) {
                for (const seg1 of p1Obj.swordSegmentsWorld) {
                    for (const seg2 of p2Obj.swordSegmentsWorld) {
                        const res = segmentToSegmentCollision(seg1.a, seg1.b, seg2.a, seg2.b);
                        const clashThreshold = seg1.radius + seg2.radius + 6;

                        if (res.distance <= clashThreshold) {
                            p1Obj.slashState = 'retract';
                            p2Obj.slashState = 'retract';

                            p1Obj.clashCooldown = 14;
                            p2Obj.clashCooldown = 14;

                            p1Obj.partHitTimers['sword'] = PART_FLASH_DURATION;
                            p2Obj.partHitTimers['sword'] = PART_FLASH_DURATION;

                            p1Obj.x -= p1Obj.facingDir * CLASH_KNOCKBACK;
                            p2Obj.x -= p2Obj.facingDir * CLASH_KNOCKBACK;

                            createClashSparks(res.contactPoint.x, res.contactPoint.y);
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function checkHits(attacker, defender) {
            if (attacker.isSlashing && attacker.slashState === 'swing' && defender.hitCooldown <= 0 && defender.hp > 0) {
                let detectedHit = null;
                let bestPriority = -1;

                const partPriority = {
                    head: 3,
                    upper_body: 2,
                    lower_body: 2
                };

                for (const swordSeg of attacker.swordSegmentsWorld) {
                    for (const [partName, capsules] of Object.entries(defender.bodyCapsulesWorld)) {
                        for (const cap of capsules) {
                            const res = segmentToSegmentCollision(swordSeg.a, swordSeg.b, cap.a, cap.b);
                            const hitThreshold = swordSeg.radius + cap.radius;

                            if (res.distance <= hitThreshold) {
                                const priority = partPriority[partName] || 1;
                                if (!detectedHit || priority > bestPriority) {
                                    bestPriority = priority;
                                    detectedHit = {
                                        name: partName,
                                        pos: res.contactPoint
                                    };
                                }
                            }
                        }
                    }
                }

                if (detectedHit) {
                    let partMultiplier = 1.0;
                    let isCritical = false;

                    switch (detectedHit.name) {
                        case 'head':
                            partMultiplier = 1.2;
                            isCritical = true;
                            break;
                        case 'upper_body':
                        case 'lower_body':
                            partMultiplier = 1.0;
                            break;
                        default:
                            partMultiplier = 0.5;
                            break;
                    }

                    const chargeMultiplier = attacker.activeSlashMultiplier || 1.0;
                    const finalDamage = Math.round(BASE_DAMAGE * partMultiplier * chargeMultiplier);

                    defender.hp = Math.max(0, defender.hp - finalDamage);
                    defender.hitCooldown = 16;

                    defender.partHitTimers[detectedHit.name] = PART_FLASH_DURATION;

                    attacker.slashState = 'retract';

                    const knockbackDist = (isCritical ? 40 : 22) * chargeMultiplier;
                    defender.x += attacker.facingDir * knockbackDist;

                    createHitSparks(detectedHit.pos.x, detectedHit.pos.y, isCritical, chargeMultiplier);
                    updateHpBars();

                    if (defender.hp <= 0 && !gameOver) {
                        triggerGameOver(attacker === p1 ? '🎉 CHALAWAN P1 ชนะ!' : '🎉 CHALAWAN P2 ชนะ!');
                    }

                    return true;
                }
            }
            return false;
        }

        function updateHpBars() {
            const p1Pct = Math.max(0, (p1.hp / p1.maxHp) * 100);
            const p2Pct = Math.max(0, (p2.hp / p2.maxHp) * 100);

            document.getElementById('p1HpBar').style.width = p1Pct + '%';
            document.getElementById('p2HpBar').style.width = p2Pct + '%';
        }

        function triggerGameOver(winnerMessage) {
            gameOver = true;
            document.getElementById('winnerText').textContent = winnerMessage;
            document.getElementById('winnerModal').classList.remove('hidden');
        }

        document.getElementById('btnRestart').addEventListener('click', () => {
            p1.hp = 100;
            p2.hp = 100;
            p1.x = canvas.width * 0.28;
            p1.y = canvas.height * 0.56;
            p2.x = canvas.width * 0.72;
            p2.y = canvas.height * 0.56;
            p1.hitCooldown = 0;
            p2.hitCooldown = 0;
            p1.clashCooldown = 0;
            p2.clashCooldown = 0;
            p1.partHitTimers = {};
            p2.partHitTimers = {};
            p1.handAimAngle = 0;
            p2.handAimAngle = 0;
            p1.isCharging = false;
            p1.chargeFrames = 0;
            p1.chargeRatio = 0;
            p1.activeSlashCharge = 0;
            p1.activeSlashAura = 0;
            p1.activeSlashMultiplier = 1;
            p1.isSlashing = false;
            p1.slashState = 'idle';
            p1.slashAngle = 0;
            p2.isCharging = false;
            p2.chargeFrames = 0;
            p2.chargeRatio = 0;
            p2.activeSlashCharge = 0;
            p2.activeSlashAura = 0;
            p2.activeSlashMultiplier = 1;
            p2.isSlashing = false;
            p2.slashState = 'idle';
            p2.slashAngle = 0;
            particles = [];
            timerSeconds = 60;
            document.getElementById('timerText').textContent = timerSeconds;
            gameOver = false;
            updateHpBars();
            document.getElementById('winnerModal').classList.add('hidden');
        });

        function updatePlayerChargeState(playerObj) {
            if (playerObj.isCharging) {
                playerObj.chargeFrames = Math.min(MAX_CHARGE_FRAMES, playerObj.chargeFrames + 1);
                playerObj.chargeRatio = playerObj.chargeFrames / MAX_CHARGE_FRAMES;
                playerObj.slashAngle = -playerObj.chargeRatio * MAX_CHARGE_WINDUP;
            }
        }

        function stepPlayerSlash(playerObj, subSteps) {
            if (!playerObj.isSlashing) return;

            const swingSpeed = SLASH_SWING_SPEED * (1 + playerObj.activeSlashCharge * 0.35);

            if (playerObj.slashState === 'swing') {
                playerObj.slashAngle += swingSpeed / subSteps;
                if (playerObj.slashAngle >= MAX_SLASH_ANGLE) {
                    playerObj.slashAngle = MAX_SLASH_ANGLE;
                    playerObj.slashState = 'retract';
                }
            } else if (playerObj.slashState === 'retract') {
                playerObj.slashAngle -= SLASH_RETRACT_SPEED / subSteps;
                if (playerObj.slashAngle <= 0) {
                    playerObj.slashAngle = 0;
                    playerObj.slashState = 'idle';
                    playerObj.isSlashing = false;
                    playerObj.activeSlashCharge = 0;
                    playerObj.activeSlashAura = 0;
                    playerObj.activeSlashMultiplier = 1.0;
                }
            }
        }

        function processSlashAndCollisions() {
            const SUB_STEPS = 6;

            updatePlayerChargeState(p1);
            updatePlayerChargeState(p2);

            for (let step = 0; step < SUB_STEPS; step++) {
                stepPlayerSlash(p1, SUB_STEPS);
                stepPlayerSlash(p2, SUB_STEPS);

                updatePlayerTransforms(p1, p1Joints);
                updatePlayerTransforms(p2, p2Joints);

                if (checkSwordClash(p1, p2)) {
                    break;
                }

                checkHits(p1, p2);
                checkHits(p2, p1);
            }
        }

        function updatePartTimers(playerObj) {
            for (const part in playerObj.partHitTimers) {
                if (playerObj.partHitTimers[part] > 0) {
                    playerObj.partHitTimers[part]--;
                }
            }
        }

        function updateMovementKinematics(playerObj, moveX, moveY) {
            const speedFactor = playerObj.isCharging ? 0.72 : 1.0;
            const actualMoveX = moveX * speedFactor;
            const actualMoveY = moveY * speedFactor;

            playerObj.vx = actualMoveX;
            playerObj.vy = actualMoveY;
            playerObj.x += actualMoveX;
            playerObj.y += actualMoveY;

            const isMoving = (actualMoveX !== 0 || actualMoveY !== 0);
            const targetBlend = isMoving ? 1 : 0;
            playerObj.walkBlend += (targetBlend - playerObj.walkBlend) * 0.2;

            if (isMoving) {
                const dirSign = (actualMoveX * playerObj.facingDir) < 0 ? -1 : 1;
                playerObj.walkPhase += 0.22 * dirSign * speedFactor;
            }
            playerObj.idlePhase += 0.06;
        }

        // --- 8. MAIN LOOP ---
        function update() {
            if (gameOver) return;

            p1.facingDir = (p1.x <= p2.x) ? 1 : -1;
            p2.facingDir = (p2.x >= p1.x) ? -1 : 1;

            p1.visualFacingX += (p1.facingDir - p1.visualFacingX) * 0.25;
            p2.visualFacingX += (p2.facingDir - p2.visualFacingX) * 0.25;

            if (p1.hitCooldown > 0) p1.hitCooldown--;
            if (p2.hitCooldown > 0) p2.hitCooldown--;
            if (p1.clashCooldown > 0) p1.clashCooldown--;
            if (p2.clashCooldown > 0) p2.clashCooldown--;

            updatePartTimers(p1);
            updatePartTimers(p2);

            // P1 HAND CONTROL (Q/E)
            if (keys['q'] || keys['Q']) {
                p1.handAimAngle = Math.max(HAND_MIN_ANGLE, p1.handAimAngle - HAND_CONTROL_SPEED);
            }
            if (keys['e'] || keys['E']) {
                p1.handAimAngle = Math.min(HAND_MAX_ANGLE, p1.handAimAngle + HAND_CONTROL_SPEED);
            }

            // P2 HAND CONTROL (U/O หรือ ,/.)
            if (keys['u'] || keys['U'] || keys[','] || keys['<']) {
                p2.handAimAngle = Math.max(HAND_MIN_ANGLE, p2.handAimAngle - HAND_CONTROL_SPEED);
            }
            if (keys['o'] || keys['O'] || keys['.'] || keys['>']) {
                p2.handAimAngle = Math.min(HAND_MAX_ANGLE, p2.handAimAngle + HAND_CONTROL_SPEED);
            }

            // P1 MOVEMENT (WASD)
            let p1MoveX = 0, p1MoveY = 0;
            if (keys['w'] || keys['W']) p1MoveY -= MOVE_SPEED;
            if (keys['s'] || keys['S']) p1MoveY += MOVE_SPEED;
            if (keys['a'] || keys['A']) p1MoveX -= MOVE_SPEED;
            if (keys['d'] || keys['D']) p1MoveX += MOVE_SPEED;
            updateMovementKinematics(p1, p1MoveX, p1MoveY);

            // P2 MOVEMENT (Arrows or IJKL)
            let p2MoveX = 0, p2MoveY = 0;
            if (keys['ArrowUp'] || keys['i'] || keys['I']) p2MoveY -= MOVE_SPEED;
            if (keys['ArrowDown'] || keys['k'] || keys['K']) p2MoveY += MOVE_SPEED;
            if (keys['ArrowLeft'] || keys['j'] || keys['J']) p2MoveX -= MOVE_SPEED;
            if (keys['ArrowRight'] || keys['l'] || keys['L']) p2MoveX += MOVE_SPEED;
            updateMovementKinematics(p2, p2MoveX, p2MoveY);

            processSlashAndCollisions();

            // Boundaries
            p1.x = Math.max(80, Math.min(canvas.width - 80, p1.x));
            p1.y = Math.max(120, Math.min(canvas.height - 120, p1.y));
            p2.x = Math.max(80, Math.min(canvas.width - 80, p2.x));
            p2.y = Math.max(120, Math.min(canvas.height - 120, p2.y));

            updatePlayerTransforms(p1, p1Joints);
            updatePlayerTransforms(p2, p2Joints);

            spawnSwordAuraParticles(p1);
            spawnSwordAuraParticles(p2);

            updateParticles();
        }

        function render() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1.5;
            const gridSize = 45;

            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            renderPlayer(p1, p1Joints);
            renderPlayer(p2, p2Joints);

            drawParticles();
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>

</html>
