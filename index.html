<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Shadow Puppet - Classic Arcade Fighting Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/styles.css">
</head>

<body class="relative h-screen w-screen overflow-hidden bg-white text-slate-900 flex flex-col justify-between">


    <div id="startScreen"
        class="hidden fixed inset-0 z-40 menu-grid-bg flex flex-col items-center justify-center select-none">

        <div class="w-[75%] max-w-[460px] mb-10 sm:mb-12 pointer-events-none flex justify-center">
            <img src="src/assets/images/nang-action.png" alt="NANG ACTION" class="w-full h-auto object-contain" />
        </div>

        <div class="flex flex-col items-center gap-6">
            <button id="btnGameStart" type="button"
                class="stepped-btn bg-[#f5c400] hover:bg-[#eab308] active:scale-95 text-black silkscreen-font font-bold text-sm sm:text-base md:text-lg tracking-[0.18em] w-60 sm:w-68 py-4 transition-transform cursor-pointer">
                GAME START
            </button>

            <button id="btnTutorial" type="button"
                class="stepped-btn bg-black hover:bg-neutral-800 active:scale-95 text-white silkscreen-font font-bold text-sm sm:text-base md:text-lg tracking-[0.18em] w-60 sm:w-68 py-4 transition-transform cursor-pointer">
                TUTORIAL
            </button>
        </div>
    </div>


    <div id="charSelectScreen"
        class="hidden fixed inset-0 z-40 bg-[#f5c400] flex flex-col items-center justify-between py-6 sm:py-8 px-6 sm:px-12 select-none overflow-hidden">

        <div class="w-full max-w-[1150px] flex items-center justify-center relative mt-1">
            <h2
                class="silkscreen-font text-2xl sm:text-4xl md:text-[42px] text-black tracking-[0.08em] -skew-x-12 font-normal">
                SELECT YOUR NANG
            </h2>
        </div>

        <div id="charPreviewContainer"
            class="w-full max-w-[1150px] grid grid-cols-2 gap-5 sm:gap-7 my-auto cursor-pointer">


            <div
                class="relative bg-white border-[4px] border-black rounded-xl h-[250px] sm:h-[340px] md:h-[410px] overflow-hidden flex items-center justify-center">
                <div
                    class="absolute top-0 left-0 bg-black text-white silkscreen-font font-bold text-xs sm:text-sm md:text-base tracking-[0.2em] px-5 sm:px-7 py-2.5 rounded-br-2xl z-10">
                    <span id="p1CharName">CHALAWAN</span>
                </div>
                <canvas id="p1PreviewCanvas" width="520" height="440"
                    class="w-full h-full object-contain pointer-events-none"></canvas>
            </div>


            <div
                class="relative bg-white border-[4px] border-black rounded-xl h-[250px] sm:h-[340px] md:h-[410px] overflow-hidden flex items-center justify-center">
                <div
                    class="absolute top-0 right-0 bg-black text-white silkscreen-font font-bold text-xs sm:text-sm md:text-base tracking-[0.2em] px-5 sm:px-7 py-2.5 rounded-bl-2xl z-10">
                    <span id="p2CharName">CHALAWAN</span>
                </div>
                <canvas id="p2PreviewCanvas" width="520" height="440"
                    class="w-full h-full object-contain pointer-events-none"></canvas>
            </div>

        </div>

        <div class="w-full max-w-[1150px] flex items-center justify-start gap-6 pb-2 sm:pb-3">
            <div id="charThumbChalawan"
                class="relative p-1 rounded-2xl border-[3px] border-black bg-[#f5c400] cursor-pointer hover:scale-105 active:scale-95 transition-transform">

                <div
                    class="w-32 h-28 sm:w-44 sm:h-36 md:w-48 md:h-40 bg-white border-[3px] border-black rounded-xl overflow-hidden flex items-center justify-center">
                    <canvas id="thumbCanvas1" width="220" height="190"
                        class="w-full h-full object-cover pointer-events-none"></canvas>
                </div>

                <div class="absolute -bottom-3.5 inset-x-0 flex items-center justify-center gap-2 pointer-events-none">
                    <div
                        class="bg-black text-[#f5c400] border-[2.5px] border-black rounded-md px-2.5 py-0.5 silkscreen-font font-bold text-xs sm:text-sm leading-tight shadow-sm">
                        P1
                    </div>
                    <div
                        class="bg-white text-black border-[2.5px] border-black rounded-md px-2.5 py-0.5 silkscreen-font font-bold text-xs sm:text-sm leading-tight shadow-sm">
                        P2
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div id="tutorialScreen"
        class="hidden fixed inset-0 z-40 menu-grid-bg flex flex-col items-center justify-center p-6 select-none">
        <div
            class="bg-white/95 border-4 border-black p-8 sm:p-10 max-w-lg w-full text-center space-y-6 shadow-[8px_8px_0px_#000000]">
            <h2 class="silkscreen-font font-bold text-xl sm:text-2xl text-black tracking-widest">TUTORIAL</h2>

            <div
                class="border-2 border-dashed border-slate-400 bg-slate-50 py-10 px-4 text-slate-700 font-bold text-sm sm:text-base space-y-2">
                <p>🛠️ [ TUTORIAL PLACEHOLDER ]</p>
                <p class="text-xs text-slate-500 font-normal">พื้นที่สำหรับใส่ขั้นตอนการฝึกสอนเชิดหุ่นและวิธีบังคับ</p>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 justify-center pt-2">
                <button id="btnBackToMenu" type="button"
                    class="stepped-btn bg-black hover:bg-neutral-800 active:scale-95 text-white silkscreen-font font-bold text-xs sm:text-sm tracking-[0.18em] px-6 py-3.5 transition-transform cursor-pointer">
                    BACK
                </button>
            </div>
        </div>
    </div>


    <canvas id="stageCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>


    <div id="topHud"
        class="relative z-10 w-full px-4 pt-3 pb-1 sm:px-8 sm:pt-4 md:px-12 flex items-center justify-between gap-3 pointer-events-none transition-opacity duration-200 opacity-0">


        <div class="flex items-center gap-2 sm:gap-3 flex-1 max-w-[45%] justify-start">
            <div id="p1HudName"
                class="bg-black text-white font-black text-xs sm:text-sm md:text-base px-3 sm:px-5 py-1.5 rounded-full border-2 sm:border-3 border-black tracking-wider shrink-0 shadow-md">
                CHALAWAN
            </div>
            <div
                class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-full bg-black text-white text-xs sm:text-sm md:text-base font-black flex items-center justify-center shrink-0 border-2 sm:border-3 border-black shadow-md">
                P1
            </div>
            <div
                class="flex-1 h-7 sm:h-9 md:h-11 bg-black rounded-full p-1 sm:p-1.5 shadow-md border-2 sm:border-3 border-black flex items-center">
                <div class="w-full h-full bg-white rounded-full p-0.5 overflow-hidden">
                    <div id="p1HpBar" class="h-full bg-[#facc15] rounded-full transition-all duration-150"
                        style="width: 100%;"></div>
                </div>
            </div>
        </div>


        <div class="flex flex-col items-center justify-center shrink-0 mx-2">
            <div
                class="w-12 h-12 sm:w-16 sm:h-16 md:w-20 md:h-20 bg-black rounded-full border-3 sm:border-4 border-black flex items-center justify-center text-white font-mono text-2xl sm:text-3xl md:text-4xl font-black shadow-lg pixel-font tracking-tighter">
                <span id="timerText">60</span>
            </div>
            <div class="flex gap-1.5 mt-1 sm:mt-1.5">
                <span id="roundDot1"
                    class="w-3 h-3 sm:w-4 sm:h-4 md:w-5 md:h-5 rounded-full border-2 sm:border-3 border-black bg-black inline-block shadow-sm"></span>
                <span id="roundDot2"
                    class="w-3 h-3 sm:w-4 sm:h-4 md:w-5 md:h-5 rounded-full border-2 sm:border-3 border-black bg-white inline-block shadow-sm"></span>
                <span id="roundDot3"
                    class="w-3 h-3 sm:w-4 sm:h-4 md:w-5 md:h-5 rounded-full border-2 sm:border-3 border-black bg-white inline-block shadow-sm"></span>
            </div>
        </div>


        <div class="flex items-center gap-2 sm:gap-3 flex-1 max-w-[45%] justify-end">
            <div
                class="flex-1 h-7 sm:h-9 md:h-11 bg-black rounded-full p-1 sm:p-1.5 shadow-md border-2 sm:border-3 border-black flex items-center">
                <div class="w-full h-full bg-white rounded-full p-0.5 overflow-hidden">
                    <div id="p2HpBar" class="h-full bg-[#facc15] rounded-full transition-all duration-150 ml-auto"
                        style="width: 100%;"></div>
                </div>
            </div>
            <div
                class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-full bg-black text-white text-xs sm:text-sm md:text-base font-black flex items-center justify-center shrink-0 border-2 sm:border-3 border-black shadow-md">
                P2
            </div>
            <div id="p2HudName"
                class="bg-black text-white font-black text-xs sm:text-sm md:text-base px-3 sm:px-5 py-1.5 rounded-full border-2 sm:border-3 border-black tracking-wider shrink-0 shadow-md">
                CHALAWAN
            </div>
        </div>

    </div>


    <div id="bottomFloorBar"
        class="relative z-10 w-full h-10 sm:h-12 md:h-14 bg-black border-t-4 border-black shrink-0 transition-opacity duration-200 opacity-0">
    </div>


    <script src="src/config.js"></script>
    <script src="src/state.js"></script>
    <script src="src/input.js"></script>
    <script src="src/kinematics.js"></script>
    <script src="src/combat.js"></script>
    <script src="src/renderer.js"></script>
</body>

</html>
